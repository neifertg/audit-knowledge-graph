# Full test suite on every push and pull request, with a real Neo4j (E3 child e, change 019).
# No secrets: the Neo4j password below is a throwaway for a service container that lives only for this job.
# AKG_REQUIRE_NEO4J=1 turns every Neo4j skip into a failure, and the last step fails on any skip,
# so this workflow cannot go green with the Neo4j tests skipped.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      neo4j:
        image: neo4j:5.26.33-community
        env:
          NEO4J_AUTH: neo4j/ci-only-throwaway
          NEO4J_server_memory_heap_initial__size: 512m
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 512m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-throwaway 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-only-throwaway
      AKG_REQUIRE_NEO4J: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Wait for Neo4j to accept Bolt connections
        run: |
          python - <<'EOF'
          import os, time
          from neo4j import GraphDatabase
          last = None
          for attempt in range(60):
              try:
                  with GraphDatabase.driver(os.environ["NEO4J_URI"],
                                            auth=(os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"])) as d:
                      d.verify_connectivity()
                  print(f"Neo4j ready after {attempt} retries")
                  break
              except Exception as error:
                  last = f"{type(error).__name__}: {error}"
                  time.sleep(2)
          else:
              raise SystemExit(f"Neo4j did not become ready in 120 s; last error: {last}")
          EOF

      - name: Full test suite (Neo4j required)
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee test-output.txt

      - name: Fail if any test was skipped
        run: |
          if grep -qE "^(OK|FAILED) \(.*skipped=[0-9]+" test-output.txt; then
            echo "::error::Some tests were skipped; every test must run in CI"
            exit 1
          fi
          grep -E "^Ran [0-9]+ tests" test-output.txt
